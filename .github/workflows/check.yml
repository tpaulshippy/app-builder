name: Check pull request

# Gate PRs on lint + tests so main stays green. (deploy.yml covers pushes
# to main; this covers everything else before merge.)
on:
  pull_request:
    branches: [main]

jobs:
  lint-test:
    name: Lint and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Test (vitest)
        run: npm run test
