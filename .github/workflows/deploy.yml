name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-test:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/lint-test.yml

  deploy:
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned to reviewed SHAs (see lint-test.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Sync OPENCODE_ZEN_KEY secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENCODE_ZEN_KEY: ${{ secrets.OPENCODE_ZEN_KEY }}
        run: |
          if [ -n "$OPENCODE_ZEN_KEY" ]; then
            printf '%s' "$OPENCODE_ZEN_KEY" | npx wrangler secret put OPENCODE_ZEN_KEY
          else
            echo "OPENCODE_ZEN_KEY not set; skipping secret sync"
          fi
