name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Check pull request"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    # Manual dispatches always run; chained runs only on green checks.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned to reviewed SHAs (actions/checkout@v4, actions/setup-node@v4).
      # check out the tested commit, not whatever main points at now.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Sync OPENCODE_ZEN_KEY secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENCODE_ZEN_KEY: ${{ secrets.OPENCODE_ZEN_KEY }}
        run: |
          if [ -n "$OPENCODE_ZEN_KEY" ]; then
            printf '%s' "$OPENCODE_ZEN_KEY" | npx wrangler secret put OPENCODE_ZEN_KEY
          else
            echo "OPENCODE_ZEN_KEY not set; skipping secret sync"
          fi
