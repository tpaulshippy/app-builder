# Shared lint+test job, called by check.yml (PRs) and deploy.yml (main).
# Runs with the caller's permissions; needs contents:read for checkout.
on:
  workflow_call:

jobs:
  lint-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      # Pinned to reviewed SHAs (actions/checkout@v4, actions/setup-node@v4).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Test (vitest)
        run: npm run test
